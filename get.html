<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Opening OpenChat on the App Store…</title>
  <link rel="canonical" href="https://openchat.zpad.app/get.html" />
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="get-wrap">
    <div class="get-card">
      <img src="assets/icon.png" alt="OpenChat icon" class="get-icon">
      <h1><span class="spin"></span><span id="title">Taking you to the App Store…</span></h1>
      <p id="subtitle">OpenChat for iPhone and iPad should open momentarily.</p>
      <noscript><p><a id="nslink" href="https://apps.apple.com/us/app/openchat-pro/id6813100017">Click here if nothing happens</a></p></noscript>
      <p style="margin-top:22px;"><a href="download.html">Back to downloads</a></p>
    </div>
  </main>

  <script>
    const APPSTORE_URL = "https://apps.apple.com/us/app/openchat-pro/id6813100017";

    (function () {
      const title = document.getElementById("title");
      const subtitle = document.getElementById("subtitle");
      const nslink = document.getElementById("nslink");

      nslink.href = APPSTORE_URL;
      setTimeout(() => window.location.href = APPSTORE_URL, 1200);
      setTimeout(() => subtitle.innerHTML = 'Nothing happening? <a href="' + APPSTORE_URL + '">Retry</a>', 4000);
    })();
  </script>
</body>
</html>
